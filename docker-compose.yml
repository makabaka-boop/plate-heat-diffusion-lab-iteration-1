services:
  plate-api:
    build: ./plate-api
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  plate-ui:
    build: ./plate-ui
    ports:
      - "8080:80"
    depends_on:
      plate-api:
        condition: service_healthy
